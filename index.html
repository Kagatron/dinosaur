<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🦖恐龙知识大挑战</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg,#348e5e,#f2b736,#e67035);
            padding: 12px;
            color: #222;
        }
        .top-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }
        .stat-bar {
            flex: 1;
            background: rgba(255,255,255,0.92);
            border-radius: 12px;
            padding: 8px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 500;
            gap: 4px;
        }
        .stat-bar div { white-space: nowrap; }
        .stat-bar .stat-label { color: #000; font-weight: 400; }
        .stat-bar span.num { font-weight: 700; }
        .stat-bar #total, .stat-bar #rate { color: #2f6fd0; }
        .stat-bar #ok { color: #22a055; }
        .stat-bar #no { color: #e03636; }
        .reset-btn {
            background: rgba(255,255,255,0.92);
            color: #e74c3c;
            border: none;
            border-radius: 12px;
            padding: 8px 10px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.2s;
        }
        .reset-btn:hover { background: rgba(255,255,255,1); }
        #modeBtn { color: #2f6fd0; }
        #modeBtn.on { color: #22a055; font-weight: 700; }
        .main-card {
            flex: 1;
            background: #ffffff;
            border-radius: 16px;
            padding: 16px 16px 180px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .title {
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 12px;
            color: #2c5c42;
        }
        .clue-wrap {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 4px;
        }
        .clue-row {
            font-size: 15px;
            line-height: 1.6;
            margin: 6px 0;
            padding: 8px 10px;
            background: #f7f9f8;
            border-radius: 8px;
            word-break: break-word;
        }
        .clue-row .sep {
            margin: 0 6px;
            opacity: 0.4;
        }
        .hint-btn {
            width: 100%;
            margin-top: 8px;
            padding: 10px;
            border: none;
            border-radius: 10px;
            background: #fff3e0;
            color: #b26a00;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .hint-btn:hover { background: #ffe0b2; }
        .hint-btn:disabled {
            opacity: 0.55;
            cursor: default;
        }
        .hint-area {
            display: none;
            margin-top: 6px;
        }
        .hint-item {
            border-left: 3px solid #f2b736;
        }
        .answer-area {
            position: fixed;
            left: 12px;
            right: 12px;
            bottom: 12px;
            z-index: 20;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            background: #ffffff;
            border-radius: 14px;
            padding: 12px;
            box-shadow: 0 -2px 16px rgba(0,0,0,0.12);
        }
        .option-btn {
            flex: 1 1 0;
            min-width: 0;
            padding: 14px 6px;
            margin: 0;
            border: none;
            border-radius: 12px;
            background: #e8f5e9;
            color: #2c5c42;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
        }
        .option-btn:hover { background: #c8e6c9; }
        .option-btn.right { background: #28a745; color: #fff; }
        .option-btn.wrong { background: #dc3545; color: #fff; }
        .option-btn:disabled { cursor: default; }
        .result-tip {
            width: 100%;
            max-height: 32vh;
            overflow-y: auto;
            margin: 6px 0 0;
            padding: 10px;
            border-radius: 10px;
            font-size: 15px;
            line-height: 1.6;
            display: none;
        }
        .result-correct { background: #e6f9ec; color: #15702e; }
        .result-wrong { background: #fde8ea; color: #b32434; }
        .fun-fact {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed rgba(0,0,0,0.15);
            font-size: 14px;
        }
        .next-btn {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            border: none;
            border-radius: 12px;
            background: #f08c33;
            color: #fff;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            display: none;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="stat-bar">
            <div><span class="stat-label">总题</span> <span class="num" id="total">0</span></div>
            <div><span class="stat-label">对</span> <span class="num" id="ok">0</span></div>
            <div><span class="stat-label">错</span> <span class="num" id="no">0</span></div>
            <div><span class="stat-label">正确率</span> <span class="num" id="rate">0%</span></div>
        </div>
        <button class="reset-btn" id="modeBtn">名字</button>
        <button class="reset-btn" id="resetBtn">重置</button>
    </div>
    <div class="main-card">
        <div class="title" id="titleText">📖根据线索猜猜是什么恐龙？</div>
        <div class="clue-wrap" id="clueWrap">加载题库中…</div>
        <button class="hint-btn" id="hintBtn">💡提示</button>
        <div class="hint-area" id="hintArea"></div>
        <div class="answer-area">
            <button class="option-btn" id="opt1"></button>
            <button class="option-btn" id="opt2"></button>
            <button class="option-btn" id="opt3"></button>
            <div class="result-tip" id="resultTip"></div>
            <button class="next-btn" id="nextBtn">下一题 →</button>
        </div>
    </div>

<script>
// 题库从 knowledge.json 异步加载，与页面分离
let dinoList = [];
let stat = JSON.parse(localStorage.getItem("dinoQuizStat_v2")||'{"total":0,"ok":0,"no":0}');
let currentDino = null;
let currentQType = "guess"; // 当前题型：guess猜名字 / era问时代 / diet问食性
let currentAnswer = "";     // 当前题型的正确答案（恐龙名/时代/食性）
let mixedMode = false;      // false:只出猜名字题 true:三种题型混合

const clueWrap = document.getElementById("clueWrap");
const opt1 = document.getElementById("opt1");
const opt2 = document.getElementById("opt2");
const opt3 = document.getElementById("opt3");
const resultTip = document.getElementById("resultTip");
const nextBtn = document.getElementById("nextBtn");
const hintBtn = document.getElementById("hintBtn");
const hintArea = document.getElementById("hintArea");
const domTotal = document.getElementById("total");
const domOk = document.getElementById("ok");
const domNo = document.getElementById("no");
const domRate = document.getElementById("rate");
const titleText = document.getElementById("titleText");
const modeBtn = document.getElementById("modeBtn");

function refreshStat(){
    domTotal.innerText = stat.total;
    domOk.innerText = stat.ok;
    domNo.innerText = stat.no;
    let r = stat.total===0?0:Math.round(stat.ok/stat.total*100);
    domRate.innerText = r+"%";
    localStorage.setItem("dinoQuizStat_v2",JSON.stringify(stat));
}

function newQuestion(){
    if(!dinoList.length) return;
    resultTip.style.display="none";
    resultTip.innerHTML="";
    nextBtn.style.display="none";
    opt1.className="option-btn";opt1.disabled=false;
    opt2.className="option-btn";opt2.disabled=false;
    opt3.className="option-btn";opt3.disabled=false;
    hintBtn.style.display="block";
    hintBtn.innerText="💡提示";
    hintArea.style.display="none";
    hintArea.innerHTML="";

    let idx = Math.floor(Math.random()*dinoList.length);
    currentDino = dinoList[idx];
    // 当前题目的别名列表（多个别名用" | "分隔，统一转成数组）
    currentDino._aliases = (currentDino["别名"]||"").split("|").map(s=>s.trim()).filter(Boolean);

    // 随机选题型：默认只出猜名字题；开启"混合题型"后加入问时代/问食性（时代、食性为空值的恐龙不参与对应题型）
    const types = ["guess"];
    if(mixedMode){
        if(currentDino["时代"]) types.push("era");
        if(currentDino["食性"]) types.push("diet");
    }
    currentQType = types[Math.floor(Math.random()*types.length)];

    if(currentQType==="guess"){
        buildGuessQuestion();
    }else{
        buildEraDietQuestion(currentQType);
    }
}

// 原题型：看线索猜恐龙名（3选1）
function buildGuessQuestion(){
    let others = dinoList.filter(d=>d["中文名称"]!==currentDino["中文名称"]);
    for(let i=others.length-1;i>0;i--){
        let j=Math.floor(Math.random()*(i+1));
        [others[i],others[j]]=[others[j],others[i]];
    }
    let distractors = others.slice(0,2);
    currentAnswer = currentDino["中文名称"];
    let answerList = [currentAnswer,distractors[0]["中文名称"],distractors[1]["中文名称"]].sort(()=>Math.random()-0.5);
    opt1.innerText = answerList[0];
    opt2.innerText = answerList[1];
    opt3.innerText = answerList[2];
    titleText.innerText = "📖根据线索猜猜是什么恐龙？";
    buildClueRows();
}

// 新题型：给出恐龙名，问时代/食性（选项固定为3种值）
function buildEraDietQuestion(qtype){
    const choices = qtype==="era" ? ["三叠纪","侏罗纪","白垩纪"] : ["肉食","植食","杂食"];
    currentAnswer = qtype==="era" ? currentDino["时代"] : currentDino["食性"];
    // 选项固定顺序：时代为 三叠纪/侏罗纪/白垩纪，食性为 肉食/植食/杂食
    opt1.innerText = choices[0];
    opt2.innerText = choices[1];
    opt3.innerText = choices[2];
    titleText.innerText = qtype==="era"
        ? "🦕【"+currentDino["中文名称"]+"】生活在哪个时代？"
        : "🦕【"+currentDino["中文名称"]+"】的食性是什么？";
    buildClueRows(qtype==="diet");
}

// 生成线索行；问时代题不显示时代行，问食性题（hideDiet=true）不显示食性行和生活习性行，避免暴露答案
function buildClueRows(hideDiet){
    const sep = '<span class="sep">·</span>';
    const sp = '<span class="sep">｜</span>';
    const tax = [currentDino["目"], currentDino["类"], currentDino["科"]].filter(Boolean);
    const rows = [];
    if(tax.length) rows.push('<div class="clue-row">🔬&nbsp;'+tax.join(sep)+'</div>');
    if(currentQType!=="era" && currentDino["时代细分"]){
        rows.push('<div class="clue-row">⏳'+currentDino["时代细分"]+'</div>');
    }
    if(!hideDiet && currentDino["食性"]){
        rows.push('<div class="clue-row">🍃'+currentDino["食性"]+'</div>');
    }
    const sizeWeight = [
        currentDino["体长"] ? "📏"+currentDino["体长"] : "",
        currentDino["体重"] ? "⚖️"+currentDino["体重"] : ""
    ].filter(Boolean);
    if(sizeWeight.length) rows.push('<div class="clue-row">'+sizeWeight.join(sp)+'</div>');
    if(currentDino["外形特征"]) rows.push('<div class="clue-row">✨'+currentDino["外形特征"]+'</div>');
    if(!hideDiet && currentDino["生活习性"]) rows.push('<div class="clue-row">🌿'+currentDino["生活习性"]+'</div>');
    clueWrap.innerHTML = rows.join("");
    clueWrap.appendChild(hintBtn);
    clueWrap.appendChild(hintArea);
}

// 提示按钮：点击后直接替换为命名原因（不显示"命名原因"字样，不显示别名）
hintBtn.onclick = ()=>{
    const reason = currentDino["命名原因"];
    hintArea.innerHTML = '<div class="clue-row" style="margin:6px 0;">提示：'+(reason || '暂无更多提示')+'</div>';
    hintArea.style.display = "block";
    hintBtn.style.display = "none";
};

function selectAnswer(selName){
    stat.total +=1;
    let isRight = selName === currentAnswer;
    const dinoName = "【"+currentDino["中文名称"]+"】";
    let base;
    if(currentQType==="guess"){
        // 答案文本：有别名时附上"又名【别名1】【别名2】"
        let nameText = dinoName;
        if(currentDino._aliases && currentDino._aliases.length){
            nameText += "，又名"+currentDino._aliases.map(a=>"【"+a+"】").join("");
        }
        base = isRight ? "🎉答对啦！就是"+nameText : "❌答错啦！正确答案是"+nameText;
    }else if(currentQType==="era"){
        base = isRight
            ? "🎉答对啦！"+dinoName+"生活在"+currentAnswer+"！"
            : "❌答错啦！"+dinoName+"生活在"+currentAnswer+"，而不是"+selName+"。";
    }else{
        base = isRight
            ? "🎉答对啦！"+dinoName+"是"+currentAnswer+"性！"
            : "❌答错啦！"+dinoName+"的食性是"+currentAnswer+"，而不是"+selName+"。";
    }
    if(isRight){
        stat.ok +=1;
        resultTip.className="result-tip result-correct";
    }else{
        stat.no +=1;
        resultTip.className="result-tip result-wrong";
    }
    // 答后追加趣闻
    const fun = currentDino["趣闻"];
    resultTip.innerHTML = base + (fun ? '<div class="fun-fact">💡趣闻：'+fun+'</div>' : "");
    resultTip.style.display="block";
    nextBtn.style.display="block";
    opt1.disabled=true;opt2.disabled=true;opt3.disabled=true;

    [opt1,opt2,opt3].forEach(o=>{
        if(o.innerText===currentAnswer) o.classList.add("right");
        if(o.innerText===selName&&!isRight) o.classList.add("wrong");
    });
    refreshStat();
}

async function loadData(){
    try{
        let res = await fetch("knowledge.json",{cache:"no-store"});
        if(!res.ok) throw new Error("HTTP "+res.status);
        let data = await res.json();
        if(!Array.isArray(data)||!data.length) throw new Error("题库为空");
        dinoList = data;
        newQuestion();
    }catch(e){
        clueWrap.innerHTML =
            '<div class="clue-row">⚠️ 加载题库失败：'+e.message+'</div>'+
            '<div class="clue-row">请通过本地服务器访问（http-server）或确认 knowledge.json 存在。</div>';
    }
}

opt1.onclick=()=>selectAnswer(opt1.innerText);
opt2.onclick=()=>selectAnswer(opt2.innerText);
opt3.onclick=()=>selectAnswer(opt3.innerText);
nextBtn.onclick = ()=>newQuestion();
modeBtn.onclick = ()=>{
    mixedMode = !mixedMode;
    modeBtn.innerText = mixedMode ? "综合" : "名字";
    modeBtn.classList.toggle("on", mixedMode);
    newQuestion();
};

document.getElementById("resetBtn").onclick = ()=>{
    stat = {total:0,ok:0,no:0};
    refreshStat();
    newQuestion();
};

refreshStat();
loadData();
</script>
</body>
</html>
